id: translated_to_bilingual
name: 译文 SRT → 双语 ASS
version: 1
description: 匹配原项目 → 校验译文 → 合并双语 ASS → 导出。匹配与合并将在 M7 完成。
builtin: true
inputs:
  - name: translated
    kind: files
    accept: [".srt", ".ass"]
    required: true
steps:
  - id: match
    uses: sub.match_project
    with:
      strategy: stem_then_timeline
  - id: validate
    uses: sub.validate
    needs: [match]
    with:
      fail_on_error: false
  - id: merge
    uses: sub.merge_bilingual
    needs: [validate]
    with:
      style_preset: house_default
      output_suffix: ".zh&en"
  - id: export
    uses: sub.export
    needs: [merge]
    with:
      format: ass
      suffix: ""
      output_dir: ""
      backup: true
outputs:
  - from: export
    key: files
ui: {}
