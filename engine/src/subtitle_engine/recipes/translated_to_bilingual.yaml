id: translated_to_bilingual
name: 译文 SRT → 双语 ASS
version: 2
description: 校验译文 → 与原版字幕合并双语 ASS → 导出。
builtin: true
inputs:
  - name: original
    label: 原版字幕
    kind: files
    accept: [".srt"]
    required: true
    multiple: true
    bind:
      - step: merge
        port: original
  - name: translated
    label: 译文字幕
    kind: files
    accept: [".srt"]
    required: true
    multiple: true
    bind:
      - step: validate
        port: subs
steps:
  - id: validate
    uses: sub.validate
    with:
      fail_on_error: false
  - id: merge
    uses: sub.merge_bilingual
    needs: [validate]
    with:
      style_preset: house_default
      output_suffix: ".zh&en"
  - id: export
    uses: sub.export
    needs: [merge]
    with:
      format: ass
      suffix: ""
      output_dir: ""
      backup: true
outputs:
  - from: export
    key: files
ui:
  kind: workflow
  group: 主流程
  order: 20
