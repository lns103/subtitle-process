[project]
name = "subtitle-process"
version = "0.9.7-beta"
description = "基于 Python 和 CustomTkinter 开发的本地字幕处理工具箱"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "customtkinter",
    "tkinterdnd2",
]

[dependency-groups]
dev = [
    "pyinstaller",
    # >=2026.7 修复 tkinterdnd2 在 Tcl 9（Python 3.14）下打包后加载 tkdnd 失败的问题
    "pyinstaller-hooks-contrib>=2026.7",
]

[tool.uv]
package = false
