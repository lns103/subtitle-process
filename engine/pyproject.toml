[project]
name = "subtitle-engine"
# 版本号唯一来源：src/subtitle_engine/version.py::__version__
dynamic = ["version"]
description = "Headless subtitle pipeline engine (JSON-RPC over stdio)"
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "httpx>=0.28",
    "keyring>=25.5",
    "pydantic>=2.9",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/subtitle_engine/version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/subtitle_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
# 旧工具箱冻结副本仅用于 golden 对比，保持原样，不参与格式/规则检查。
extend-exclude = ["tests/legacy_reference"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
