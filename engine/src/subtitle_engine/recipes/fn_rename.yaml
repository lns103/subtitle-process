id: fn_rename
name: 重命名字幕
version: 1
description: 按视频文件名中的 SxxExx 配对，把字幕改成与视频同名。
builtin: true
inputs:
  - name: subs
    label: 字幕文件
    kind: files
    accept: [".srt", ".ass", ".vtt"]
    required: true
    multiple: true
    bind:
      - step: rename
        port: subs
  - name: video
    label: 视频文件
    kind: files
    accept: [".mkv", ".mp4", ".mov", ".avi", ".ts"]
    required: true
    multiple: true
steps:
  - id: rename
    uses: sub.rename
    with:
      suffix: ""
      dry_run: false
outputs:
  - from: rename
    key: subs
ui:
  kind: function
  group: 字幕处理
  order: 39
