id: batch_normalize
name: 批量规范字幕
version: 1
description: 对一批 SRT 执行清理、合并与校验，输出 <原名>.normalized.srt。
builtin: true
inputs:
  - name: files
    label: 字幕文件
    kind: files
    accept: [".srt"]
    required: true
steps:
  - id: normalize
    uses: sub.normalize
    with:
      strip_html: true
      merge_short: true
      merge_identical: true
      clean_person: true
      clean_uppercase: false
      zh_punctuation: false
  - id: validate
    uses: sub.validate
    needs: [normalize]
    with:
      fail_on_error: false
  - id: export
    uses: sub.export
    needs: [validate]
    with:
      format: srt
      suffix: ""
      output_dir: ""
      backup: true
outputs:
  - from: export
    key: files
ui:
  kind: workflow
  group: 批处理
  order: 40
