id: batch_shift_fps
name: 批量帧率转换
version: 1
description: 按帧率比例缩放一批字幕的时间轴；支持 SRT / ASS / SSA / VTT，ASS 输出仍为 ASS。
builtin: true
inputs:
  - name: files
    label: 字幕文件
    kind: files
    accept: [".srt", ".ass", ".ssa", ".vtt"]
    required: true
steps:
  - id: fps
    uses: sub.fps_convert
    with:
      fps_in: 23.976
      fps_out: 25.0
      suffix: ".fps"
  - id: export
    uses: sub.export
    needs: [fps]
    with:
      format: auto
      suffix: ""
      output_dir: "output/fps"
      backup: true
outputs:
  - from: export
    key: files
ui:
  kind: workflow
  group: 批处理
  order: 50
