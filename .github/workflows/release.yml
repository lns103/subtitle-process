name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"
  TARGET_TRIPLE: x86_64-pc-windows-msvc

jobs:
  release:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv (Python 3.15)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync --frozen

      - name: Engine tests
        working-directory: engine
        run: uv run pytest -q

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build-engine.ps1 -TargetTriple $env:TARGET_TRIPLE

      - name: Verify sidecar
        shell: pwsh
        run: |
          $binary = "apps/desktop/src-tauri/binaries/subtitle-engine-$env:TARGET_TRIPLE.exe"
          if (-not (Test-Path -LiteralPath $binary)) {
            throw "Sidecar was not built: $binary"
          }
          Get-Item -LiteralPath $binary | Select-Object FullName, Length

      - name: Configure updater signing
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            $configPath = "apps/desktop/src-tauri/tauri.conf.json"
            $config = Get-Content -LiteralPath $configPath -Raw | ConvertFrom-Json
            $config.bundle.createUpdaterArtifacts = $false
            $config | ConvertTo-Json -Depth 32 | Set-Content -LiteralPath $configPath -Encoding utf8
            Write-Warning "TAURI_SIGNING_PRIVATE_KEY is not configured; building without updater artifacts."
          }
          else {
            Write-Host "Updater signing key detected; updater artifacts will be generated."
          }

      - name: Build Tauri bundle
        working-directory: apps/desktop
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $version = (Get-Content -LiteralPath "src-tauri/tauri.conf.json" -Raw | ConvertFrom-Json).version
          if ($version -match '(?i)(alpha|beta|rc)') {
            Write-Host "Pre-release ${version}: building NSIS only (WiX/MSI requires numeric prerelease)."
            npm run tauri build -- --bundles nsis
          }
          else {
            npm run tauri build
          }

      - name: Create portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1 -TargetTriple $env:TARGET_TRIPLE

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: subtitle-process-windows-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
            apps/desktop/src-tauri/target/release/bundle/**/*.sig

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') || contains(github.ref_name, 'rc') }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
            apps/desktop/src-tauri/target/release/bundle/**/*.sig
