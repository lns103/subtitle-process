id: fn_normalize
name: 规范字幕
version: 1
description: 清理括号/标签/人名提示，合并短句与相同行；VTT 自动转 SRT。
builtin: true
inputs:
  - name: subs
    label: 字幕文件
    kind: files
    accept: [".srt", ".vtt"]
    required: true
    multiple: true
    bind:
      - step: normalize
        port: subs
steps:
  - id: normalize
    uses: sub.normalize
    with:
      strip_html: true
      merge_short: true
      merge_identical: true
      clean_person: true
      clean_uppercase: false
      zh_punctuation: false
      drop_hash_only: true
  - id: export
    uses: sub.export
    needs: [normalize]
    with:
      format: srt
      suffix: ""
      output_dir: ""
      to_source: true
      backup: true
outputs:
  - from: export
    key: files
ui:
  kind: function
  group: 字幕处理
  order: 31
