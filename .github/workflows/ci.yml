name: CI

on:
  push:
    branches: ["master", "main"]
  pull_request:
    branches: ["master", "main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  engine:
    name: Engine · ruff + pytest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv (Python 3.15)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Ensure FFmpeg and MKVToolNix are available
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          $mkvDir = "C:\Program Files\MKVToolNix"
          if (-not (Get-Command mkvextract -ErrorAction SilentlyContinue)) {
            choco install mkvtoolnix -y --no-progress
          }
          # Chocolatey 修改的是机器 PATH，后续 step 的新 shell 不会自动继承；
          # 显式写入 GITHUB_PATH，保证 pytest 能通过 shutil.which 找到 mkvextract。
          if (Test-Path -LiteralPath $mkvDir) {
            Add-Content -LiteralPath $env:GITHUB_PATH -Value $mkvDir
          }
          ffmpeg -version | Select-Object -First 1
          mkvextract --version | Select-Object -First 2

      - name: Test
        run: uv run pytest -q

  desktop-web:
    name: Desktop · Vitest + build
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build frontend
        run: npm run build

  desktop-rust:
    name: Desktop · cargo check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Create placeholder sidecar
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "apps/desktop/src-tauri/binaries/subtitle-engine-x86_64-pc-windows-msvc.exe"
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $path) | Out-Null
          if (-not (Test-Path -LiteralPath $path)) {
            New-Item -ItemType File -Path $path | Out-Null
          }

      - name: Check Rust shell
        working-directory: apps/desktop/src-tauri
        run: cargo check

  package:
    name: Package · Windows installer + portable ZIP
    if: github.event_name != 'pull_request'
    needs: [engine, desktop-web, desktop-rust]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up uv (Python 3.15)
        uses: astral-sh/setup-uv@v9.0.0
        with:
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: engine/uv.lock

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install engine dependencies
        working-directory: engine
        run: uv sync --frozen

      - name: Build Python sidecar
        shell: pwsh
        run: ./scripts/build-engine.ps1 -TargetTriple x86_64-pc-windows-msvc

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build NSIS installer
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $cfg = Join-Path $env:RUNNER_TEMP "tauri.no-updater.json"
          '{"bundle":{"createUpdaterArtifacts":false}}' | Set-Content -LiteralPath $cfg -Encoding utf8
          npm run tauri build -- --bundles nsis --config $cfg

      - name: Create portable ZIP
        shell: pwsh
        run: ./scripts/package-portable.ps1 -TargetTriple x86_64-pc-windows-msvc

      - name: Upload Windows executables
        uses: actions/upload-artifact@v7
        with:
          name: subtitle-process-windows-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/portable/*.zip
