id: video_to_clean_srt
name: 视频 → 规范字幕
version: 1
description: 提取内嵌字幕 → 清理 → 校验 → 导出干净 SRT。SDH 扫描/Agent 将在 M5/M6 接入。
builtin: true
inputs:
  - name: video
    kind: file
    accept: [".mkv", ".mp4", ".mov", ".avi", ".ts"]
    required: true
steps:
  - id: probe
    uses: media.probe
  - id: extract
    uses: media.extract_subtitles
    needs: [probe]
    with:
      selection: auto
      prefer_embedded: true
  - id: normalize
    uses: sub.normalize
    needs: [extract]
    with:
      strip_html: true
      merge_short: true
      merge_identical: true
      clean_person: true
      clean_uppercase: false
      zh_punctuation: false
  - id: validate
    uses: sub.validate
    needs: [normalize]
    with:
      fail_on_error: false
  - id: export
    uses: sub.export
    needs: [validate]
    with:
      format: srt
      suffix: ".clean"
      output_dir: ""
      backup: true
outputs:
  - from: export
    key: files
ui: {}
