id: fn_export
name: 导出字幕
version: 1
description: 把字幕写成 UTF-8 + LF 文件，覆盖前保留 .bak。
builtin: true
inputs:
  - name: subs
    label: 字幕文件
    kind: files
    accept: [".srt", ".ass", ".vtt"]
    required: true
    multiple: true
    bind:
      - step: export
        port: subs
steps:
  - id: export
    uses: sub.export
    with:
      format: srt
      suffix: ""
      output_dir: ""
      backup: true
outputs:
  - from: export
    key: files
ui:
  kind: function
  group: 字幕处理
  order: 37
